# Travo starter playbook — DRAFT, requires review by a Vietnamese-qualified lawyer [verify].
# Services agreements under Vietnamese law. Firm positions only (ADR-014).
key: services_vn
version: 1
name: Services agreement (Vietnamese law) — starter draft
applies_to: { contract_types: [MSA], governing_laws: [VN] }
rules:
  - key: scope_and_service_levels
    clause_key: service_levels
    required: true
    standard: Services, deliverables and measurable service levels are defined.
    standard_vi: Xác định rõ dịch vụ, sản phẩm bàn giao và tiêu chuẩn chất lượng đo lường được.
    severity: high
    rationale: Without measurable standards performance cannot be enforced.
  - key: price_payment_terms
    clause_key: price_payment
    required: true
    standard: Fees, invoicing and payment deadline are stated.
    standard_vi: Nêu rõ phí dịch vụ, hóa đơn và thời hạn thanh toán.
    severity: high
    rationale: Payment disputes are the most common source of claims.
  - key: price_currency_vnd
    clause_key: price_payment
    must_include_any: [vnd, vnđ, việt nam đồng, đồng việt nam, vietnamese dong]
    severity: medium
    standard: Fees between Vietnamese residents are in VND.
    standard_vi: Phí dịch vụ giữa các bên cư trú tại Việt Nam bằng đồng Việt Nam.
    rationale: Foreign exchange rules restrict foreign-currency pricing between residents [verify].
  - key: acceptance
    clause_key: delivery_acceptance
    standard: Acceptance (nghiệm thu) procedure for deliverables.
    standard_vi: Thủ tục nghiệm thu sản phẩm, dịch vụ.
    severity: medium
    rationale: Fixes when fees become payable and when defects must be raised.
  - key: penalty_cap
    clause_key: penalty
    max_percent: 8
    severity: high
    standard: Penalty no more than 8% of the value of the breached obligation [verify].
    standard_vi: Mức phạt không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm [verify].
    rationale: Luật Thương mại 2005, Điều 301 [verify].
    redline_template: >-
      The breaching party shall pay a penalty equal to [●]% (not exceeding 8%) of the value of
      the breached part of the contractual obligation.
    redline_template_vi: >-
      Bên vi phạm phải chịu phạt vi phạm với mức [●]% (không vượt quá 8%) giá trị phần nghĩa vụ
      hợp đồng bị vi phạm.
  - key: liability_cap
    clause_key: limitation_of_liability
    required: true
    must_not_include_any: [unlimited liability, trách nhiệm không giới hạn]
    standard: Liability capped (e.g. fees paid in the last 12 months), with usual exclusions.
    standard_vi: Giới hạn trách nhiệm (ví dụ bằng phí đã thanh toán trong 12 tháng gần nhất).
    severity: medium
    rationale: Protects the client from disproportionate exposure.
  - key: confidentiality
    clause_key: confidentiality_obligations
    required: true
    standard: Mutual confidentiality obligations.
    standard_vi: Nghĩa vụ bảo mật của các bên.
    must_include_any: [bảo mật, bí mật, confidential]
    severity: medium
    rationale: Service providers routinely receive confidential information.
  - key: data_protection
    clause_key: data_protection
    standard: Personal data handled under a DPA or equivalent clauses.
    standard_vi: Dữ liệu cá nhân được xử lý theo thỏa thuận xử lý dữ liệu hoặc điều khoản tương đương.
    severity: medium
    rationale: Service providers often process personal data (PDP Law 2025 [verify]).
  - key: term_termination
    clause_key: term_and_termination
    required: true
    standard: Term and termination rights, including for material breach.
    standard_vi: Thời hạn và quyền chấm dứt, kể cả khi có vi phạm nghiêm trọng.
    severity: medium
    rationale: Exit rights are essential for long-running services.
  - key: force_majeure
    clause_key: force_majeure
    required: true
    standard: Force majeure defined, with notice and mitigation obligations.
    standard_vi: Định nghĩa sự kiện bất khả kháng, nghĩa vụ thông báo và hạn chế thiệt hại.
    severity: medium
    rationale: Allocates risk of events outside the parties' control.
  - key: governing_law_vn
    clause_key: governing_law
    required: true
    standard: Vietnamese law.
    standard_vi: Pháp luật Việt Nam.
    must_include_any: [pháp luật việt nam, laws of vietnam, laws of viet nam, vietnamese law, laws of the socialist republic of vietnam]
    severity: medium
    rationale: Foreign law only with a foreign element (Bộ luật Dân sự 2015, Điều 663, 683 [verify]).
  - key: forum_vn
    clause_key: dispute_resolution
    required: true
    standard: VIAC arbitration or a competent Vietnamese court.
    standard_vi: Trọng tài VIAC hoặc Tòa án có thẩm quyền của Việt Nam.
    must_include_any: [viac, trọng tài, tòa án, arbitration, court]
    severity: medium
    rationale: A clear, enforceable forum.
  - key: language_prevailing
    clause_key: language
    standard: States which language version prevails (bilingual contracts).
    standard_vi: Quy định bản ngôn ngữ được ưu tiên áp dụng (hợp đồng song ngữ).
    must_include_any: [ưu tiên, prevail]
    severity: medium
    rationale: Bilingual contracts need a tie-breaker.
