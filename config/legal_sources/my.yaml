# Malaysian instruments for contract review (ADR-019, ADR-020). Act numbers are from memory
# [verify] unless noted. Two ways in:
# - `url`: the official English reprint PDF on the Laws of Malaysia portal (AGC) — then
#   `make legal-fetch JUR=MY`.
# - a PDF obtained from the portal by hand — `make legal-import FILE=… ID=MY/ACT136`, then
#   `make legal-fetch JUR=MY OFFLINE=1`. Add the official URL here when known.
# Entries with neither are reported as "needs_url", never guessed.
jurisdiction: MY
issuing_body: Attorney General's Chambers of Malaysia (Laws of Malaysia)
instruments:
