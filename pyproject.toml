[project]
name = "travo"
version = "0.1.0"
description = "Travo — agentic legal-process platform (P0 foundations)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "cryptography>=42",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api", "services/rag", "services/router", "services/agents", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"evals/**" = ["S"]
"evals/make_gold.py" = ["S", "E501"]  # fixture prose

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "services/api:services/rag:services/router:services/agents"
explicit_package_bases = true
packages = ["travo_api", "travo_rag", "travo_router", "travo_agents"]
